  app:
    build:
      context: data-ingestion
      dockerfile: Dockerfile
    container_name: county_gis_app
    ports:
      - "8000:8000"
    env_file:
      - data-ingestion/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   db:
    #     condition: service_healthy

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: county_gis_web
    env_file:
      - web/.env
    ports:
      - "3000:3000"
    depends_on:
      - app

