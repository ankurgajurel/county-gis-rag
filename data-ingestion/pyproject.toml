[project]
name = "county-gis-ingestion"
version = "0.1.0"
description = "County GIS data ingestion pipeline for Cook & DuPage Counties"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.15",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "aiohttp>=3.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]
